name: 功能建议
description: 提出新功能、新接入方式或兼容性改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述使用场景，而不是直接给方案。你遇到了什么不方便？
      placeholder: 例：我希望在不启动 relay 层的情况下也能跨机访问
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      description: 如果有具体想法可以写在这里，没有也可以
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 目前你是怎么绕过这个问题的？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 和文档，确认这不是已有功能
          required: true
